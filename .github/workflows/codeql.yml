name: CodeQL

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Kotlin requires a traced build (manual/autobuild). Overlay only works with
  # build-mode: none, so disable it explicitly to avoid the fallback warning.
  CODEQL_OVERLAY_DATABASE_MODE: none

on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/codeql.yml
  pull_request:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/codeql.yml
  schedule:
    - cron: "24 18 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java/Kotlin
    # Pin until we validate ubuntu-26.04 (ubuntu-latest migrates Oct 19, 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # Flutter/Android includes Kotlin; none would skip Kotlin analysis.
          build-mode: manual

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
