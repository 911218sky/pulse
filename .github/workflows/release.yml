name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    # Pin until we validate ubuntu-26.04 (ubuntu-latest migrates Oct 19, 2026).
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_PATH: android/app/upload-keystore.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: pulse-release
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Pin stable so cache keys stay stable across tag builds.
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Tune Gradle for CI runners
        run: |
          {
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.caching=true'
            echo 'org.gradle.configureondemand=true'
            echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError'
          } >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for release APK signing."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD secrets are required for release APK signing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12

      # Warm Gradle once with split APKs, then reuse the daemon for AAB + universal.
      # Universal is derived from the AAB via bundletool (avoids a third full Flutter compile).
      - name: Build Android split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build universal APK from App Bundle
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION=1.18.3
          curl -fsSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=build/universal.apks \
            --mode=universal \
            --ks=android/app/upload-keystore.p12 \
            --ks-pass=pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass=pass:"$ANDROID_KEY_PASSWORD"
          mkdir -p build/universal-apk
          unzip -p build/universal.apks universal.apk > build/universal-apk/app-release.apk

      - name: Prepare Android release artifacts
        run: |
          mkdir -p build/release-artifacts/android
          cp build/universal-apk/app-release.apk \
            build/release-artifacts/android/pulse-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/release-artifacts/android/pulse-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/release-artifacts/android/pulse-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            build/release-artifacts/android/pulse-android-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab \
            build/release-artifacts/android/pulse-android-release.aab

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pulse-android
          path: build/release-artifacts/android/*

  create-release:
    needs: [build-android]
    # Pin until we validate ubuntu-26.04 (ubuntu-latest migrates Oct 19, 2026).
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: pulse-android
          path: artifacts

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          NOTES="Android release artifacts for ${TAG}."
          ASSETS=(
            "artifacts/pulse-android-universal.apk"
            "artifacts/pulse-android-arm64-v8a.apk"
            "artifacts/pulse-android-armeabi-v7a.apk"
            "artifacts/pulse-android-x86_64.apk"
            "artifacts/pulse-android-release.aab"
          )

          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Missing release asset: $asset"
              ls -la artifacts || true
              exit 1
            fi
          done

          publish_release() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" --clobber "${ASSETS[@]}"
              gh release edit "$TAG" \
                --draft=false \
                --latest \
                --title "$TAG" \
                --notes "$NOTES"
              return 0
            fi

            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              --latest \
              "${ASSETS[@]}"
          }

          for attempt in 1 2 3 4 5; do
            if publish_release; then
              echo "Release ${TAG} published successfully."
              exit 0
            fi

            echo "Release publish attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done

          echo "Failed to publish ${TAG} after 5 attempts."
          exit 1
